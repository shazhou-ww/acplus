name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      check-version:
        description: "Check candidate version availability without publishing"
        required: false
        type: string
      verify-version:
        description: "Verify an already published version without publishing"
        required: false
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if:
      github.event_name == 'push' || (inputs.verify-version == '' &&
      inputs.check-version == '')
    name: Publish verified tag
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install the trusted publishing client
        run: npm install --global npm@11.21.0

      - name: Verify release metadata
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync } = require("node:fs");
          const packageJson = require("./package.json");
          const stableVersion = /^\d+\.\d+\.\d+$/u;
          const canaryVersion = /^\d+\.\d+\.\d+-canary\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/u;
          const expectedTag = `v${packageJson.version}`;

          if (packageJson.private === true) {
            console.error(
              "::error::Set private to false or remove it before publishing.",
            );
            process.exit(1);
          }

          if (packageJson.name !== "acplus") {
            console.error(
              "::error::The release package name must be acplus.",
            );
            process.exit(1);
          }

          if (!stableVersion.test(packageJson.version) && !canaryVersion.test(packageJson.version)) {
            console.error(
              `::error::Expected X.Y.Z or X.Y.Z-canary.DATE.SEQUENCE; received ${packageJson.version}.`,
            );
            process.exit(1);
          }

          if (
            process.env.RELEASE_EVENT === "push" &&
            process.env.RELEASE_TAG !== expectedTag
          ) {
            console.error(
              `::error::Tag ${process.env.RELEASE_TAG} does not match package version ${expectedTag}.`,
            );
            process.exit(1);
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `name=${packageJson.name}\nversion=${packageJson.version}\ndist-tag=${canaryVersion.test(packageJson.version) ? "canary" : "latest"}\n`,
          );
          NODE

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Reject an existing npm version
        if: github.event_name == 'push'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/check-npm-version.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm check

      - name: Publish package
        if: github.event_name == 'push'
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run:
          npm publish --access public --tag "$DIST_TAG"
          --registry=https://registry.npmjs.org/ --loglevel=verbose

      - name: Validate trusted publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm pkg set "version=0.0.0-oidc-dry-run.${GITHUB_RUN_ID}"
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { statSync } = require('node:fs');
          const manifest = require('./package.json');
          assert.equal(manifest.name, 'acplus');
          assert.equal(manifest.bin.acplus.replace(/^\.\//u, ''), 'dist/acp-cli.js');
          assert.ok(statSync(manifest.bin.acplus).isFile());
          console.log(JSON.stringify({ version: manifest.version, bin: manifest.bin, builtCliPresent: true }));
          NODE
          set -o pipefail
          npm publish --dry-run --access public --tag oidc-dry-run --registry=https://registry.npmjs.org/ --loglevel=verbose 2>&1 | tee "$RUNNER_TEMP/oidc-dry-run.log"
          if grep -Fq 'auto-correct' "$RUNNER_TEMP/oidc-dry-run.log"; then
            echo "::error::npm must not auto-correct the release manifest."
            exit 1
          fi

  inspect:
    name: Check candidate version availability
    if: github.event_name == 'workflow_dispatch' && inputs.check-version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Validate inspection mode
        env:
          VERIFY_VERSION: ${{ inputs.verify-version }}
        run: |
          if [ -n "$VERIFY_VERSION" ]; then
            echo "::error::Choose either check-version or verify-version, not both."
            exit 1
          fi
      - name: Check out verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
      - name: Inspect successful registry metadata
        env:
          PACKAGE_VERSION: ${{ inputs.check-version }}
        run: node scripts/check-npm-version.ts

  verify:
    name: Verify published package
    if:
      github.event_name == 'workflow_dispatch' && inputs.verify-version != '' &&
      inputs.check-version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
      - name: Verify registry metadata and installed CLI
        env:
          PACKAGE_VERSION: ${{ inputs.verify-version }}
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { existsSync, mkdirSync, mkdtempSync, readFileSync, statSync, symlinkSync } = require('node:fs');
          const { join } = require('node:path');
          const version = process.env.PACKAGE_VERSION;
          assert.match(version, /^\d+\.\d+\.\d+(?:-canary\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))?$/);
          const distTag = version.includes('-canary.') ? 'canary' : 'latest';
          const registry = '--registry=https://registry.npmjs.org/';
          const metadata = JSON.parse(execFileSync('npm', ['view', `acplus@${version}`, '--json', registry], { encoding: 'utf8' }));
          assert.equal(metadata.name, 'acplus');
          assert.equal(metadata.version, version);
          assert.equal(metadata['dist-tags'][distTag], version);
          if (distTag === 'canary') assert.match(metadata['dist-tags'].latest, /^\d+\.\d+\.\d+$/, 'Canary must not replace stable latest');
          assert.ok(metadata.bin?.acplus, 'Published metadata must retain the CLI bin');
          assert.ok(metadata.dist?.attestations?.url, 'Published version must include provenance');
          const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'acplus-verify-'));
          execFileSync('npm', ['install', '--prefix', directory, `acplus@${version}`, '--ignore-scripts', '--no-audit', '--no-fund', registry], { stdio: 'inherit' });
          const installed = join(directory, 'node_modules', 'acplus');
          const manifest = JSON.parse(readFileSync(join(installed, 'package.json'), 'utf8'));
          assert.equal(manifest.version, version);
          assert.equal(manifest.name, 'acplus');
          assert.equal(manifest.bin.acplus.replace(/^\.\//, ''), 'dist/acp-cli.js');
          assert.deepEqual(manifest.files, ['dist', 'README.md', 'LICENSE']);
          assert.deepEqual(manifest.exports, {
            '.': { types: './dist/index.d.ts', import: './dist/index.js' },
            './package.json': './package.json',
          });
          assert.ok(readFileSync(join(installed, 'dist', 'index.d.ts'), 'utf8').length > 0);
          const executable = join(directory, 'node_modules', '.bin', 'acplus');
          assert.equal(execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim(), `acplus ${version} (HTTP /v2, ACP v1)`);
          const rootHelp = execFileSync(executable, ['--help'], { encoding: 'utf8' });
          assert.match(rootHelp, /acplus turns list\|start\|get\|cancel/);
          assert.match(execFileSync(executable, ['turns', 'get', '--help'], { encoding: 'utf8' }), /acplus turns list\|start\|get\|cancel/);
          let rejected = false;
          try {
            execFileSync(executable, ['turns', 'get'], { encoding: 'utf8', stdio: 'pipe' });
          } catch (error) {
            assert.equal(error.status, 2);
            assert.match(error.stderr, /required|BASE\/v2/);
            rejected = true;
          }
          assert.ok(rejected, 'Missing arguments must fail explicitly');
          assert.match(rootHelp, /acplus init/);
          assert.equal(existsSync(join(installed, 'docs')), false, 'init must not depend on unshipped templates');
          const fixture = join(directory, 'init-fixture');
          const workspace = join(fixture, 'workspace');
          const data = join(fixture, 'state');
          mkdirSync(workspace, { recursive: true });
          const initConfig = join(fixture, 'acplus.json');
          const args = ['init', '--agent-command', process.execPath, '--workspace', workspace, '--data-dir', data, '--profile', join(fixture, 'profile'), '--login-account', 'fixture-user', '--port', '4293'];
          const result = JSON.parse(execFileSync(executable, [...args, '--config', initConfig], { encoding: 'utf8' }));
          assert.deepEqual(result, { config: initConfig });
          const original = readFileSync(initConfig);
          const generated = JSON.parse(original);
          assert.equal(statSync(initConfig).mode & 0o777, 0o600);
          assert.equal(existsSync(data), false, 'init must not create data or profile directories');
          assert.equal(generated.schemaVersion, 2);
          assert.equal(generated.agents.length, 1);
          assert.equal(generated.agents[0].command, process.execPath);
          assert.deepEqual(generated.agents[0].args, ['--acp']);
          assert.equal(generated.agents[0].permission, 'deny');
          const refuse = target => {
            let refused = false;
            try {
              execFileSync(executable, [...args, '--config', target], { encoding: 'utf8', stdio: 'pipe' });
            } catch (error) {
              assert.equal(error.status, 2);
              assert.match(error.stderr, /Configuration must be a new file/);
              refused = true;
            }
            assert.ok(refused, 'Existing config and symlinks must never be replaced');
          };
          refuse(initConfig);
          const link = join(fixture, 'link.json');
          symlinkSync(initConfig, link);
          refuse(link);
          const missing = join(fixture, 'missing.json');
          const dangling = join(fixture, 'dangling.json');
          symlinkSync(missing, dangling);
          refuse(dangling);
          assert.equal(existsSync(missing), false);
          assert.deepEqual(readFileSync(initConfig), original);
          execFileSync(process.execPath, [
            '--input-type=module', '--eval',
            `import assert from 'node:assert/strict';
             import { readFileSync } from 'node:fs';
             import * as api from 'acplus';
             for (const name of ['start', 'loadConfig', 'validateConfig', 'ConfigurationError', 'ServiceError']) assert.equal(typeof api[name], 'function');
             if (process.argv[1]) api.validateConfig(JSON.parse(readFileSync(process.argv[1], 'utf8')));`,
            initConfig,
          ], { cwd: directory, stdio: 'inherit' });
          console.log(JSON.stringify({ name: metadata.name, version, distTag, tags: metadata['dist-tags'], bin: metadata.bin, provenance: metadata.dist.attestations.url, cliSmoke: 'passed', importSmoke: 'passed', initSmoke: 'passed' }));
          NODE
